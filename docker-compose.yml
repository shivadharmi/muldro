services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: muldro
      POSTGRES_PASSWORD: muldro
      POSTGRES_DB: muldro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muldro -d muldro"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: muldro
      MINIO_ROOT_PASSWORD: muldrodev
    volumes:
      - miniodata:/data

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/muldrodev
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  # ── Application services (profile "app") ──────────────────────────────────
  # Bare `docker compose up` starts infra only (preserving the native
  # `python run.py` dev loop). `docker compose --profile app up` additionally
  # builds and runs the API+worker and the frontend — the one-command stack.
  api:
    build:
      context: ./backend
    profiles: ["app"]
    env_file:
      - ./backend/.env
    environment:
      # Point the app at the compose service hostnames (override any localhost
      # values in .env). The only value the user must supply is the Anthropic key.
      MULDRO_DATABASE_URL: postgresql+asyncpg://muldro:muldro@postgres:5432/muldro
      MULDRO_REDIS_URL: redis://redis:6379/0
      MULDRO_QDRANT_URL: http://qdrant:6333
      MULDRO_NEO4J_URL: bolt://neo4j:7687
      MULDRO_NEO4J_USER: neo4j
      MULDRO_NEO4J_PASSWORD: muldrodev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    profiles: ["app"]
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  qdrantdata:
  neo4jdata:

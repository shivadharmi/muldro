# Automated integration harness (Task D). Stands up OpenConnector + the
# Connection Context Adapter for a real-HTTP e2e against the no-auth
# `hackernews` provider. NOT for production — fixed test tokens, host-mounted
# PEM. Bring up from infra/gateway/ with the env vars the test conftest sets.
services:
  openconnector:
    image: ghcr.io/oomol-lab/open-connector:v1.3.5
    ports:
      - "3000:3000"
    environment:
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OOMOL_CONNECT_ENCRYPTION_KEY:?set it}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:?set it}
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:?set it}
    restart: unless-stopped

  connection-adapter:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    entrypoint: []
    command: ["python", "run_adapter.py"]
    ports:
      - "8100:8100"
    environment:
      JARVIS_OPENCONNECTOR_MCP_URL: http://openconnector:3000/mcp
      JARVIS_OPENCONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:?set it}
      # Run the adapter under the no-auth `hackernews` profile so the automated
      # e2e can drive a real action through the full boundary (Gmail's OAuth
      # can't be headless). Selects the code-defined profile in
      # src/adapter/enforcement.py; the allowlist is not env-injected.
      JARVIS_GATEWAY_PROVIDER: hackernews
      JARVIS_PLATFORM_JWT_PRIVATE_PEM: ${JARVIS_PLATFORM_JWT_PRIVATE_PEM:?set it}
      # The adapter reads connection_map from Jarvis's EXISTING Postgres — this
      # compose does NOT run a database. Point this at the SAME DB the test
      # process (and Jarvis) use, addressed from inside the container:
      # host.docker.internal:5432 on Mac/Windows (a bridge/LAN IP on Linux).
      # The test process seeds connection_map on localhost; the adapter must see
      # those rows, so both must resolve to one database.
      JARVIS_DATABASE_URL: ${JARVIS_DATABASE_URL:?set it}
    depends_on:
      - openconnector
    restart: unless-stopped

# Gateway local dev stack.
#
# Scope: ONLY the two services introduced by the ToolHive + OpenConnector
# gateway (see docs/superpowers/specs/2026-08-16-toolhive-openconnector-gmail-slice-design.md
# for the original single-provider design; the adapter now serves every
# registered provider — gmail, googlecalendar, github — not Gmail alone):
#   - openconnector       : shared OpenConnector instance — owns every
#                            provider's OAuth connections + credential
#                            storage (spec D2).
#   - connection-adapter  : Muldro's Connection Context Adapter
#                            (backend/run_adapter.py) — the sole tenant-
#                            isolation boundary in front of OpenConnector
#                            (spec D3/D4, spec section 6).
#
# NOT started by this file (bring these up first, from the repo root):
#   - Muldro's own docker-compose.yml (postgres, redis, minio, qdrant, neo4j).
#     The adapter reads Muldro's EXISTING Postgres via MULDRO_DATABASE_URL —
#     it does not run its own database. Make sure `alembic upgrade head` has
#     already been applied there (the adapter does not run migrations).
#   - ToolHive itself. ToolHive is a separate control plane/operator with its
#     own install + lifecycle (see README.md "Manual follow-up") — this file
#     only stands up the two backend services that ToolHive's
#     VirtualMCPServer config (toolhive-vmcp-gateway.yaml) points at:
#     http://connection-adapter:8100/mcp.
#
# Image tags are pinned everywhere in this file. Never move any of them to
# `:latest` — see README.md for the pinned-version policy and rationale.
#
# Usage (from infra/gateway/):
#   export OOMOL_CONNECT_ENCRYPTION_KEY=$(openssl rand -hex 32)
#   export OOMOL_CONNECT_RUNTIME_TOKEN=$(openssl rand -hex 24)
#   export OOMOL_CONNECT_ADMIN_TOKEN=$(openssl rand -hex 24)
#   export MULDRO_PLATFORM_JWT_PUBLIC_PEM="$(openssl rsa -in /path/to/platform-jwt-key.pem -pubout)"
#   export MULDRO_DATABASE_URL=postgresql+asyncpg://muldro:muldro@host.docker.internal:5432/muldro
#   docker compose up -d
# See README.md for the full runbook and what each variable is for.

services:
  # OpenConnector — the shared multi-provider connector runtime. Owns every
  # provider's OAuth connections (gmail, googlecalendar, github) and their
  # encrypted credential store (spike-findings.md §1-§2, spike-findings-multiprovider.md;
  # spec §5.4). Single shared instance (spec D3) — the adapter, not this
  # container, is the tenant boundary.
  openconnector:
    image: ghcr.io/oomol-lab/open-connector:v1.3.5
    ports:
      # Loopback-only, matching docker-compose.prod.yml's binding for postgres/redis.
      # The adapter reaches OC over the compose network by service name, so this publish
      # exists ONLY so the Muldro API process (which runs outside compose, on the same
      # host) can reach the admin API. Publishing on 0.0.0.0 put an admin plane that
      # enumerates EVERY tenant's connections on every interface — the adapter is the
      # tenant boundary, and /api/* sits behind it, not in front.
      - "127.0.0.1:3001:3001"
    environment:
      # MANDATORY. OpenConnector will not start correctly without a stable
      # encryption key (spec §10, mirrors settings.py:256-262's hard-fail
      # pattern for Muldro's own secrets). Losing/rotating this key without a
      # migration plan orphans every stored connection — see README.md.
      # Generate with: openssl rand -hex 32
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OOMOL_CONNECT_ENCRYPTION_KEY:?Set OOMOL_CONNECT_ENCRYPTION_KEY before starting the stack — see README.md}
      # Gates POST /mcp — confirmed by spike-findings.md §3 (401 without it).
      # Generate with: openssl rand -hex 24
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:?Set OOMOL_CONNECT_RUNTIME_TOKEN before starting the stack — see README.md}
      # MANDATORY. Gates the /api/* admin plane — connection + OAuth lifecycle
      # (spike-findings-connect.md §1). DISTINCT from the runtime token above, which
      # gates /mcp only. Left unset, OpenConnector logs "local admin authentication is
      # disabled" and serves /api/* unauthenticated: GET /api/connections lists EVERY
      # connection on the shared instance with no per-tenant filter. Muldro holds the
      # same value as MULDRO_OPENCONNECTOR_ADMIN_TOKEN (see RUNBOOK-gateway.md).
      # Generate with: openssl rand -hex 24
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:?Set OOMOL_CONNECT_ADMIN_TOKEN before starting the stack — see README.md}
      # OpenConnector computes its OAuth redirect_uri from this PORT var (it
      # also drives the container's own listen port) — see
      # spike-findings-port.md. Must match the port mapping above and every
      # inter-container URL that points at this service.
      PORT: 3001
    volumes:
      - oc-data:/app/data
    restart: unless-stopped

  # Connection Context Adapter — the ONLY tenant-isolation boundary in this
  # slice (spec D3/D4, §6). Verifies the inbound platform JWT, resolves
  # (tenant_id, principal_id, provider_id, account_alias) against the
  # Muldro-owned `connection_map` table, force-rewrites `connectionName`, and
  # allowlists `actionId` before forwarding to OpenConnector with the static
  # runtime token. Serves every provider in the registry
  # (backend/src/integrations/gateway_actions/ — gmail, googlecalendar,
  # github; 21 actions) as named per-action MCP tools, plus
  # `execute_action` and `list_connections` (backend/run_adapter.py) —
  # registered as a backend in ToolHive's VirtualMCPServer
  # (toolhive-vmcp-gateway.yaml).
  connection-adapter:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    # backend/Dockerfile's default ENTRYPOINT (docker-entrypoint.sh) hardcodes
    # `alembic upgrade head && exec python run.py --worker` and does NOT
    # forward "$@" — so a bare `command:` override below would silently be
    # ignored and the container would run the full API+worker instead of the
    # adapter. Clear the entrypoint so `command` actually takes effect.
    entrypoint: []
    command: ["python", "run_adapter.py"]
    ports:
      - "8100:8100"
    environment:
      # OpenConnector, reached over the compose network by service name —
      # matches spike-findings.md's confirmed POST /mcp endpoint shape.
      MULDRO_OPENCONNECTOR_MCP_URL: http://openconnector:3001/mcp
      MULDRO_OPENCONNECTOR_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:?Set OOMOL_CONNECT_RUNTIME_TOKEN before starting the stack — see README.md}
      # RSA PUBLIC key (PEM) used to VERIFY inbound platform JWTs — the public
      # half of the key Muldro's API process signs with
      # (src/orchestrator/platform_jwt.py). Verification never needs the private
      # key, and this container is the tenant-isolation boundary: handing it the
      # signing key would let anything that compromised the adapter mint a valid
      # JWT for any tenant. Derive it with:
      #   openssl rsa -in platform-jwt.pem -pubout
      # Required: without it the adapter falls back to an ephemeral per-process
      # key, which cannot verify tokens minted by the separately-running Muldro
      # API container.
      MULDRO_PLATFORM_JWT_PUBLIC_PEM: ${MULDRO_PLATFORM_JWT_PUBLIC_PEM:?Set MULDRO_PLATFORM_JWT_PUBLIC_PEM before starting the stack — see README.md}
      # Muldro's existing Postgres (NOT started by this file — see header
      # comment), addressed AS THE CONTAINER SEES IT.
      #
      # Two variables because loopback means two different machines here. The
      # Muldro backend is a host process, so its own MULDRO_DATABASE_URL is
      # legitimately `...@127.0.0.1:5432/...` (that is what infra/user-data.sh
      # writes on the production host). Inside this container, 127.0.0.1 is the
      # container itself — the same string points at nothing, and because the
      # adapter's DB connection is lazy the container still starts and still
      # passes `--wait` while every connection lookup fails at request time.
      #
      # So: MULDRO_GATEWAY_DATABASE_URL wins when set, which is how a host with a
      # loopback backend URL supplies a container-reachable one (see
      # infra/scripts/deploy.sh, which requires it). Local-dev setups that already
      # point MULDRO_DATABASE_URL at host.docker.internal need no change and keep
      # falling through to it.
      #
      #   MULDRO_GATEWAY_DATABASE_URL=postgresql+asyncpg://muldro:...@host.docker.internal:5432/muldro
      #
      # `host.docker.internal` is provided automatically on Mac/Windows only; the
      # extra_hosts entry below makes it resolve on Linux too.
      MULDRO_DATABASE_URL: ${MULDRO_GATEWAY_DATABASE_URL:-${MULDRO_DATABASE_URL:?Set MULDRO_GATEWAY_DATABASE_URL (or a container-reachable MULDRO_DATABASE_URL) before starting the stack — see README.md}}
    extra_hosts:
      # Linux does not resolve host.docker.internal on its own (unlike Docker
      # Desktop on Mac/Windows); host-gateway maps it to the bridge gateway so the
      # DB URL above works unchanged across all three platforms.
      - "host.docker.internal:host-gateway"
    depends_on:
      - openconnector
    restart: unless-stopped

volumes:
  oc-data:

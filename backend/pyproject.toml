[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Jarvis Personal AI OS - Backend Services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "anthropic[bedrock]>=0.42.0",
    "boto3>=1.35.0",
    "pgvector>=0.3.0",
    "python-ulid>=3.0.0",
    "croniter>=2.0.0",
    "fastmcp>=3.1",
    "python-telegram-bot>=21.0",
    "websockets>=13.0",
    "cryptography>=44.0",
    # Auth
    "itsdangerous>=2.0.0",
    # S3
    "aioboto3>=13.0.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Graph DB
    "neo4j>=5.19.0",
    # Elasticsearch
    "elasticsearch[async]>=8.12.0",
    # Metrics
    "prometheus-client>=0.20.0",
    # Email (magic links)
    "resend>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests requiring a live backend (deselect with -m 'not e2e')",
]

[project]
name = "muldro-backend"
version = "0.1.0"
description = "Muldro Personal AI OS - Backend Services"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "anthropic[bedrock]>=0.42.0",
    "boto3>=1.35.0",
    "python-ulid>=3.0.0",
    "croniter>=2.0.0",
    "fastmcp>=3.1",
    "websockets>=13.0",
    "cryptography>=44.0",
    # Auth
    "itsdangerous>=2.0.0",
    # S3
    "aioboto3>=13.0.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Graph DB
    "neo4j>=5.19.0",
    # Metrics
    "prometheus-client>=0.20.0",
    # Email (magic links)
    "resend>=2.0.0",
    # Deep Agents runtime (LangChain/LangGraph migration — Phase 1 foundation).
    # Pinned to the Phase-0-confirmed minors with compatible upper bounds.
    "deepagents>=0.6.11,<0.7",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-anthropic>=1.4,<2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    "langchain-core>=1.4,<2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests requiring a live backend (deselect with -m 'not e2e')",
]
